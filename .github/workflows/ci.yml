name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        database: [sqlite, postgres]
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: halekhoob_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test -d halekhoob_test"
          --health-interval 10s --health-timeout 5s --health-retries 10
    env:
      DJANGO_DEBUG: "1"
      DATA_DIR: ${{ runner.temp }}/halekhoob-test-data
      DATABASE_URL: ${{ matrix.database == 'postgres' && 'postgresql://test:test@127.0.0.1:5432/halekhoob_test' || '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install FFmpeg and Python dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          python -m pip install -r requirements-dev.in
      - run: ruff check .
      - run: pytest -q
      - run: python manage.py makemigrations --check --dry-run
      - run: node --test tests/audio-renewal.test.cjs

  containers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -f deploy/Dockerfile.web -t halekhoob-web:ci .
      - run: docker build -f deploy/Dockerfile.worker -t halekhoob-worker:ci .
